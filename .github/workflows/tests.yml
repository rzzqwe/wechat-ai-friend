name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and script integration tests
        run: python -B -X utf8 -m unittest discover -s tests -q
      - name: Workbench voice controls
        run: python -B -X utf8 tests/verify_voice_workbench.py
      - name: Windows native paths
        run: node tests/verify_native_paths.cjs
